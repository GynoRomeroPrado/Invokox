[tool.poetry]
name = "invokox-backend"
version = "2.0.0"
description = "Backend FastAPI para sistema de procesamiento de facturas con OCR/AI"
authors = ["Equipo Invokox"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"

# Database & ORM
sqlmodel = "^0.0.14"
sqlalchemy = "^2.0.23"
alembic = "^1.12.0"

# SQL Server support (producción)
pyodbc = "^5.0.0"

# Validation
pydantic = {extras = ["email"], version = "^2.5.0"}
pydantic-settings = "^2.1.0"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.0"

# Async Tasks
celery = {extras = ["redis"], version = "^5.3.0"}
redis = "^5.0.0"

# OCR/AI Engines
paddleocr = "^2.7.3"
paddlepaddle = "^2.6.1"
# docling = "^2.55.1"  # Descomentar cuando esté disponible
pytesseract = "^0.3.13"

# Deep Learning
torch = "^2.1.0"
transformers = "^4.36.0"
pillow = "^10.1.0"

# File Processing
pypdf = "^3.17.0"
python-magic = "^0.4.27"

# Data Processing
pandas = "^2.1.0"
openpyxl = "^3.1.0"

# HTTP Client
httpx = "^0.25.0"

# Utilities
python-dateutil = "^2.8.2"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
faker = "^22.0.0"
factory-boy = "^3.3.0"

# Code Quality
black = "^23.12.0"
ruff = "^0.1.8"
mypy = "^1.7.0"
pre-commit = "^3.6.0"

# Types
types-python-dateutil = "^2.8.19"
types-redis = "^4.6.0"

# Development
ipython = "^8.18.0"
ipdb = "^0.13.13"

[tool.poetry.group.test.dependencies]
playwright = "^1.40.0"
locust = "^2.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ==============================================================================
# CONFIGURACIÓN DE HERRAMIENTAS
# ==============================================================================

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "alembic/versions",
    "__pycache__",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "paddleocr.*",
    "paddle.*",
    "celery.*",
    "faker.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config --cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
