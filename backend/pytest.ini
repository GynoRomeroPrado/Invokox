[pytest]
# ==============================================================================
# PYTEST CONFIGURATION - INVOKOX V2.0
# ==============================================================================
# Configuración global de pytest para tests unitarios e integración.
#
# Documentación: https://docs.pytest.org/en/stable/reference/customize.html
# ==============================================================================

# Directorio donde buscar tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py *_test.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# ==============================================================================
# OPCIONES DE OUTPUT
# ==============================================================================

# Mostrar resumen de tests (passed, failed, skipped, etc.)
console_output_style = progress

# Nivel de detalle por defecto
# -v: verbose, -vv: más verbose
# addopts = -v

# Mostrar print statements durante tests
# (útil para debugging, comentar en CI/CD)
# addopts = -s

# Mostrar locals en traceback
# showlocals = true

# ==============================================================================
# MARKERS PERSONALIZADOS
# ==============================================================================
# Markers para categorizar tests y ejecutar selectivamente
# Uso: @pytest.mark.unit
#      pytest -m unit  (ejecutar solo tests unitarios)

markers =
    unit: Tests unitarios rápidos sin dependencias externas
    integration: Tests de integración con DB, Redis, etc.
    slow: Tests lentos que tardan varios segundos (OCR, procesamiento)
    smoke: Tests de smoke para validación básica del sistema
    requires_db: Tests que requieren base de datos
    requires_redis: Tests que requieren Redis
    requires_ocr: Tests que requieren engines de OCR instalados

# ==============================================================================
# COVERAGE CONFIGURATION
# ==============================================================================
# Configuración de coverage (pytest-cov plugin)

# Directorios para medir coverage
# addopts = --cov=src --cov-report=html --cov-report=term

# Fallar si coverage es menor a X%
# --cov-fail-under=80

# ==============================================================================
# WARNINGS
# ==============================================================================
# Control de warnings de Python

# Configurar como manejar warnings
# default: mostrar todos
# error: convertir warnings en errores
# ignore: ignorar todos
filterwarnings =
    default
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# ==============================================================================
# LOGGING
# ==============================================================================
# Configuración de logging durante tests

# Nivel de log por defecto
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Log de archivo
log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ==============================================================================
# TIMEOUTS
# ==============================================================================
# Timeout por defecto para tests (pytest-timeout plugin)
# Previene que tests cuelguen indefinidamente

# timeout = 60  # 60 segundos por test
# timeout_method = thread

# ==============================================================================
# PYTEST-XDIST (PARALLEL EXECUTION)
# ==============================================================================
# Configuración para ejecución paralela (pytest-xdist plugin)
# Uso: pytest -n auto

# Número de workers (auto = número de CPUs)
# addopts = -n auto

# ==============================================================================
# PATHS Y DISCOVERY
# ==============================================================================

# Directorio raíz de Python path
pythonpath = .

# No buscar tests en estos directorios
norecursedirs = .git .tox dist build *.egg venv env

# ==============================================================================
# MINIMUM VERSION
# ==============================================================================

# Versión mínima de pytest requerida
minversion = 7.0

# ==============================================================================
# DOCTEST
# ==============================================================================
# Configuración de doctests (tests en docstrings)

# Ejecutar doctests en módulos
# addopts = --doctest-modules

# Directivas de doctest
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# ==============================================================================
# PLUGINS
# ==============================================================================
# Plugins de pytest automáticamente detectados

# Lista de plugins requeridos (fallará si no están instalados)
# required_plugins = pytest-cov pytest-asyncio pytest-mock

# ==============================================================================
# CUSTOM OPTIONS
# ==============================================================================
# Opciones personalizadas para este proyecto

# Archivo de configuración de entorno para tests
# env_files = .env.test

# ==============================================================================
# EJEMPLOS DE USO
# ==============================================================================
#
# Ejecutar todos los tests:
#   pytest
#
# Ejecutar con verbose:
#   pytest -v
#
# Ejecutar solo tests unitarios:
#   pytest -m unit
#
# Ejecutar tests excepto los lentos:
#   pytest -m "not slow"
#
# Ejecutar tests de un archivo específico:
#   pytest tests/domain/test_value_objects.py
#
# Ejecutar un test específico:
#   pytest tests/domain/test_value_objects.py::TestMoney::test_should_create_valid_money
#
# Ejecutar con coverage:
#   pytest --cov=src --cov-report=html
#
# Ejecutar en paralelo (requiere pytest-xdist):
#   pytest -n auto
#
# Ejecutar solo tests que fallaron la última vez:
#   pytest --lf
#
# Ejecutar con debugging (stopea en primer fallo):
#   pytest -x --pdb
#
# ==============================================================================
